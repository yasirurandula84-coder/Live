Name: Continuous Anti-Error Stream to Rumble

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download Custom Logo
        run: |
          curl -L "https://raw.githubusercontent.com/yasirurandula84-coder/Live/refs/heads/main/IMG_20261105_161937_822.jpg" --output logo.jpg

      - name: Start Ultra-Resilient Continuous Stream
        run: |
          ffmpeg -y \
            -re \
            -fflags +genpts+nobuffer \
            -use_wallclock_as_timestamps 1 \
            -timeout 15000000 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 10 \
            -reconnect_at_eof 1 \
            -reconnect_on_network_error 1 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.
            
