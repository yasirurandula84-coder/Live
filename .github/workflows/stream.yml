name: Stream Sphublive DASH to Rumble

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            // Target DASH/MPD Stream Player URL
            await page.goto('https://tv.sphublive.com/dash/mpd?manifest=https://ott-edge-mtdc04.nettv.com.np/npl/live_match3/index.mpd&keyid=b4d7fc89103597185058cc4c81a1800d&key=17062472ba2a3f1db709d3bb7761c936', {
              waitUntil: 'networkidle2'
            });

            // Wait for player container to load
            await new Promise(r => setTimeout(r, 6000));

            // Force play, unmute, and make video fullscreen
            await page.evaluate(async () => {
              window.open = function() { return null; };

              const playButton = document.querySelector('video, .vjs-big-play-button, .play-button, button, div[class*="play"]');
              if (playButton) {
                playButton.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 20

          # FFmpeg streaming inside an Auto-Reconnect Loop for Rumble RTMP
          while true; do
            echo "Starting/Restarting FFmpeg stream to Rumble..."
            ffmpeg -y \
              -f x11grab -framerate 25 -video_size 1280x720 -i :99.0 \
              -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
              -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1200k -maxrate 1500k -bufsize 3000k \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -flvflags no_duration_filesize \
              -f flv "rtmp://rtmp.rumble.com/live/k-1iw0-i82b-16tx-rqpm-9867b3" || true
            
            echo "Stream disconnected. Reconnecting in 3 seconds..."
            sleep 3
          done
          
