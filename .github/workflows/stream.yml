name: Stream Direct M3u8 with Custom Logo to Rumble

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Curl
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download Custom Logo
        run: |
          curl -L "https://raw.githubusercontent.com/yasirurandula84-coder/Live/refs/heads/main/IMG_20261105_161937_822.jpg" --output logo.jpg

      - name: Start Stream with Logo Overlay
        run: |
          ffmpeg -y \
            -re \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -i "https://fa723fc1b171.us-west-2.playback.live-video.net/api/video/v1/us-west-2.196233775518.channel.G0HGlPkRuV9j.m3u8?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzM4NCJ9..rbljfrSZIdFLp8iVgzClOEE63idRjXre_LgsAOPQX1ZCiZ_wYMrIauX6I7gszu7_7_zuFaYrmdui8CTM3v9fRVYjbKj7X-U2q03YNAM1Xd40OFWY9NBhtyjvglg-RoG8" \
            -i logo.jpg \
            -filter_complex "[1:v]scale=180:100[scaled_logo];[0:v][scaled_logo]overlay=W-w-15:10[v]" \
            -map "[v]" \
            -c:a copy \
            -c:v libx264 -preset ultrafast -b:v 3000k \
            -f flv "rtmp://rtmp.rumble.com/live/r-4nqzrs-fmy7-hvpx-92e7cc"
            
