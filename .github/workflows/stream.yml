name: Stream Match to Facebook (Fullscreen & PTV Sports Fix)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/4527', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            // PTV Sports හෝ අවශ්‍ය සර්වර් බට්න් එක ක්ලික් කිරීම සහ ස්වයංක්‍රීයව ෆුල්ස්ක්‍රීන් කිරීම
            await page.evaluate(async () => {
              window.open = function() { return null; };

              const selectServer = (serverName) => {
                const elements = Array.from(document.querySelectorAll('button, a, div, span, li'));
                const targetBtn = elements.find(el => el.textContent && el.textContent.toLowerCase().includes(serverName.toLowerCase()));
                
                if (targetBtn) {
                  targetBtn.click();
                  console.log(serverName + ' server clicked successfully!');
                  return true;
                }
                return false;
              };

              // ඔබට අවශ්‍ය සර්වර් නම මෙතැනින් වෙනස් කරගත හැක (උදා: 'PTV Sports')
              let serverName = 'PTV Sports';
              let clicked = selectServer(serverName);
              
              setTimeout(() => {
                if (!clicked) selectServer(serverName);
              }, 4000);

              // වීඩියෝ එක ලෝඩ් වී නිසි ලෙස Full Screen වීම සඳහා
              setTimeout(async () => {
                const video = document.querySelector('video');
                if (video) {
                  video.muted = false;
                  video.volume = 1.0;

                  const playerContainer = video.closest('.player-container') || video.parentElement || video;
                  
                  if (playerContainer.requestFullscreen) {
                    await playerContainer.requestFullscreen();
                  } else if (video.requestFullscreen) {
                    await video.requestFullscreen();
                  } else if (video.webkitRequestFullscreen) {
                    await video.webkitRequestFullscreen();
                  }
                }
              }, 9000);
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # FFmpeg ස්ට්‍රීම් කිරීම සහ කොපිරයිට් ෆිල්ටර්
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i default \
            -map_metadata -1 \
            -filter_complex "[0:v]scale=1260:710,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,eq=brightness=0.09:contrast=1.95:saturation=1.55:gamma=1.25,hue=h=40:s=1.35,noise=alls=50:allf=t+u,fps=29.97,\
            drawtext=text='LIVE CRICKET':x='mod(t*60, w+200)-100':y=h-30:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-280:y=48:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.9:boxborderw=10,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-280:y='if(lt(mod(t,10),1), -30+78*mod(t,10), 48)':fontsize=24:fontcolor=white:enable='between(mod(t,10),0,2)'[v]; \
            [1:a]asetrate=44100*1.15,aresample=44100,atempo=0.87,volume=1.0[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 700k -maxrate 900k -bufsize 1800k \
            -max_muxing_queue_size 4096 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -rw_timeout 30000000 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 10 \
            -reconnect_at_eof 1 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            
