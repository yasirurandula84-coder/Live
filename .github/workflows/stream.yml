name: Stream WillowHD to Facebook (Buffer Fix & Audio Pitch Shift)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl

          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Stream with FFmpeg
        run: |
          pulseaudio --start --exit-idle-time=-1 || true

          # FFmpeg command: asetrate=44100*1.15 mule audio pitch high (chipmunk/chumpking) hoil
          # Buffer size ani analyze duration vadhavlya mule reconnect honari adchan sodavli jaail
          ffmpeg -y \
            -loglevel warning \
            -analyzeduration 10000000 -probesize 10000000 \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "https://tvsen5.aynaott.com/willowhd/index.m3u8" \
            -stream_loop -1 -i bgmusic.mp3 \
            -filter_complex "[0:v]scale=1280:720,eq=brightness=0.05:contrast=1.85:saturation=1.45:gamma=1.15,hue=h=25:s=1.25,noise=alls=35:allf=t+u,fps=29.97,\
            drawtext=text='LIVE CRICKET':x='mod(t*60, w+200)-100':y=h-30:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-270:y=28:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.9:boxborderw=8,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-270:y='if(lt(mod(t,10),1), -30+58*mod(t,10), 28)':fontsize=24:fontcolor=white:alpha='if(lt(mod(t,10),1), mod(t,10), if(lt(mod(t,10),9), 1, 1-(mod(t,10)-9)))'[v]; \
            [0:a]asetrate=44100*1.18,aresample=44100,volume=1.0[main_audio]; \
            [1:a]volume=0.08[bg_audio]; \
            [main_audio][bg_audio]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 1500k -maxrate 1800k -bufsize 3600k \
            -max_muxing_queue_size 4096 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -rw_timeout 30000000 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 10 \
            -reconnect_at_eof 1 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
