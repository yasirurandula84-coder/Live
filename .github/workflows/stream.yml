name: Stream FanCode via Free India VPN to Livepush

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenVPN & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg openvpn curl jq

      - name: Connect to India VPN
        run: |
          # Fetch public active India OpenVPN configuration from VPNGate
          curl -s "https://www.vpngate.net/api/iphone/" | grep -i ",IN," | head -n 1 | cut -d',' -f15 | base64 -d > india_vpn.ovpn || true

          if [ -s india_vpn.ovpn ]; then
            echo "India VPN Config downloaded successfully."
            # Add DNS and routing fixes for OpenVPN
            echo "script-security 2" >> india_vpn.ovpn
            
            sudo openvpn --config india_vpn.ovpn --daemon
            sleep 10

            echo "Current Public IP Location:"
            curl -s https://ipinfo.io/json || true
          else
            echo "Failed to fetch VPN config, attempting direct connection fallback..."
          fi

      - name: Start Clean FanCode Stream to Livepush
        run: |
          ffmpeg -y \
            -re \
            -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36\r\nReferer: https://fancode.com/\r\nOrigin: https://fancode.com/\r\n" \
            -i "https://in-mc-flive.fancode.com/mumbai/4250368_english_hls_7ea136c62c30127_1ta-di_h264/1080p.m3u8?hdntl=Expires=1793947397~_GO=Generated~acl=/mumbai/4250368_english_hls_7ea136c62c30127_1ta-di_h264/*~SessionID=7814838588_watcho_9358b9e2-07dc-4c~Signature=AV7HGj4Hqp0E1H8NKYuPRn66pNPA9aqZ1MsiSQ1BNsucHU8j7Hul36rCbQjKDZLEwqU0_6OygsjIM1ViOh1S-CGRkecL" \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://stream.livepush.io/live/rtmp_ef89878a908e457691eda888602a67ee"
