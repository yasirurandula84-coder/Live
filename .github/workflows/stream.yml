name: Stream Match to Facebook (Willow Auto-Click + Fullscreen)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget

          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 --log-target=syslog || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true
          pactl set-default-source virtual_speaker.monitor || true

          curl -fsSL "https://raw.githubusercontent.com/yasirurandula84-coder/Live/refs/heads/main/1793782216727.jpg" -o logo.jpg || \
            ffmpeg -y -f lavfi -i color=c=black:s=460x92:d=1 -frames:v 1 logo.jpg

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          const TARGET_URL = 'https://www.streamx.website/match?id=cricket-3-bangladesh-a-vs-pakistan-a&title=Bangladesh%20A%20Vs%20Pakistan%20A';

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            page.on('console', (msg) => {
              console.log('[PAGE CONSOLE]:', msg.text());
            });
            page.on('pageerror', (err) => {
              console.log('[PAGE ERROR]:', err.message);
            });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close().catch(() => {});
                }
              }
            });

            await page.evaluateOnNewDocument(() => {
              window.open = function () { return null; };
            });

            console.log('Navigating to Bangladesh A vs Pakistan A stream...');
            try {
              await page.goto(TARGET_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              console.log('Loaded URL:', page.url());
            } catch (e) {
              console.log('Navigation error:', e.message);
            }

            await new Promise((r) => setTimeout(r, 12000));

            async function clickWillowInContext(ctx, idx) {
              return ctx.evaluate((frameIdx) => {
                window.open = function () { return null; };
                const candidates = Array.from(
                  document.querySelectorAll('button, a, div, span, li, [role="button"]')
                );
                for (const el of candidates) {
                  const text = (el.innerText || el.textContent || '').trim().toLowerCase().replace(/\s+/g, ' ');
                  const attrs = [
                    el.getAttribute('aria-label') || '',
                    el.getAttribute('title') || '',
                    el.getAttribute('data-server') || '',
                    el.getAttribute('data-channel') || '',
                    typeof el.className === 'string' ? el.className : ''
                  ].join(' ').toLowerCase();

                  const isSmallOrButton =
                    el.tagName === 'BUTTON' ||
                    el.tagName === 'A' ||
                    el.getAttribute('role') === 'button' ||
                    text.length <= 45;

                  const matchesWillow =
                    text.includes('willow') ||
                    attrs.includes('willow') ||
                    /\bwillow\b/.test(text);

                  if (isSmallOrButton && matchesWillow) {
                    el.scrollIntoView({ block: 'center', inline: 'center' });
                    el.click();
                    return { clicked: true, frameIdx, matchedText: text || attrs.slice(0, 50) };
                  }
                }
                return { clicked: false, frameIdx };
              }, idx).catch((e) => ({ clicked: false, frameIdx: idx, err: e.message }));
            }

            async function applyFullscreenAndPlayInContext(ctx, idx) {
              return ctx.evaluate(async (frameIdx) => {
                window.open = function () { return null; };

                const styleId = 'force-willow-fullscreen-style';
                if (!document.getElementById(styleId)) {
                  const style = document.createElement('style');
                  style.id = styleId;
                  style.textContent = `
                    html, body {
                      margin: 0 !important;
                      padding: 0 !important;
                      width: 1280px !important;
                      height: 720px !important;
                      overflow: hidden !important;
                      background: #000 !important;
                    }
                    iframe, video {
                      position: fixed !important;
                      top: 0 !important;
                      left: 0 !important;
                      width: 1280px !important;
                      height: 720px !important;
                      max-width: 1280px !important;
                      max-height: 720px !important;
                      z-index: 2147483647 !important;
                      background: #000 !important;
                      object-fit: contain !important;
                    }
                  `;
                  (document.head || document.documentElement).appendChild(style);
                }

                const playCandidates = Array.from(
                  document.querySelectorAll('button, [role="button"], .play, .vjs-big-play-button, .jw-icon-display')
                );
                for (const el of playCandidates) {
                  const txt = (el.innerText || el.ariaLabel || el.className || '').toLowerCase();
                  if (txt.includes('play') || el.className.toString().toLowerCase().includes('play')) {
                    try { el.click(); } catch (e) {}
                  }
                }

                const videos = Array.from(document.querySelectorAll('video'));
                for (const video of videos) {
                  video.muted = false;
                  video.volume = 1.0;
                  video.controls = false;
                  video.style.position = 'fixed';
                  video.style.top = '0';
                  video.style.left = '0';
                  video.style.width = '1280px';
                  video.style.height = '720px';
                  video.style.zIndex = '2147483647';
                  video.style.objectFit = 'contain';
                  try {
                    await video.play();
                  } catch (e) {}
                }

                return {
                  frameIdx,
                  videos: videos.length,
                  paused: videos.map((v) => v.paused),
                  readyStates: videos.map((v) => v.readyState)
                };
              }, idx).catch((e) => ({ frameIdx: idx, err: e.message }));
            }

            let clickedWillow = false;
            for (let i = 0; i < page.frames().length; i++) {
              const res = await clickWillowInContext(page.frames()[i], i);
              console.log('[WILLOW CLICK CHECK]:', JSON.stringify(res));
              if (res.clicked) clickedWillow = true;
            }

            await new Promise((r) => setTimeout(r, 6000));

            const syncPlayer = async () => {
              const frames = page.frames();
              for (let i = 0; i < frames.length; i++) {
                if (!clickedWillow) {
                  const clickRes = await clickWillowInContext(frames[i], i);
                  if (clickRes.clicked) {
                    clickedWillow = true;
                    console.log('[WILLOW LATE CLICK]:', JSON.stringify(clickRes));
                  }
                }
                const info = await applyFullscreenAndPlayInContext(frames[i], i);
                console.log('[PLAYER SYNC]:', JSON.stringify(info));
              }
            };

            await syncPlayer();
            setInterval(syncPlayer, 6000);

            await new Promise(() => {});
          })();
          EOF

          node launch.js > launch.log 2>&1 &
          sleep 30
          echo "=== LAUNCH.JS LOGS ==="
          cat launch.log || true
          echo "======================"

          cat << 'FFEOF' > run_stream.sh
          #!/usr/bin/env bash
          while true; do
            ffmpeg -y \
              -fflags +genpts \
              -thread_queue_size 2048 \
              -f x11grab -framerate 25 -video_size 1280x720 -i :99.0 \
              -thread_queue_size 2048 \
              -f pulse -i virtual_speaker.monitor \
              -loop 1 -i logo.jpg \
              -filter_complex "\
              color=c=black:s=1280x720:r=25[bg];\
              [0:v]scale=1280:720,fps=25,split=2[vorig][vbw];\
              [vbw]crop=600:85:40:615,hue=s=0[sb_bw];\
              [vorig][sb_bw]overlay=x=40:y=615:shortest=1[sb_done];\
              [sb_done]split=4[q0][q1][q2][q3];\
              [q0]crop=640:360:0:0,hue=h=-35:s=1.22,colorbalance=rs=0.14:gs=-0.08:bs=0.06:rm=0.10:gm=-0.06:bm=0.04[tl];\
              [q1]crop=640:360:640:0,hue=h=55:s=1.22,colorbalance=rs=-0.10:gs=0.15:bs=-0.05:rm=-0.08:gm=0.10:bm=-0.04[tr];\
              [q2]crop=640:360:0:360,hue=h=30:s=1.22,colorbalance=rs=0.10:gs=0.08:bs=-0.14:rm=0.08:gm=0.06:bm=-0.10[bl];\
              [q3]crop=640:360:640:360,hue=h=-85:s=1.22,colorbalance=rs=-0.08:gs=0.04:bs=0.15:rm=-0.06:gm=0.03:bm=0.10[br];\
              [bg][tl]overlay=x='mod(t*14,28)-14':y='mod(t*10,20)-10':shortest=1[s1];\
              [s1][tr]overlay=x='640+mod(t*14,28)-14':y='mod(t*10,20)-10':shortest=1[s2];\
              [s2][bl]overlay=x='mod(t*14,28)-14':y='360+mod(t*10,20)-10':shortest=1[s3];\
              [s3][br]overlay=x='640+mod(t*14,28)-14':y='360+mod(t*10,20)-10':shortest=1,\
              drawbox=x=638:y=0:w=4:h=720:color=#00aaff@0.9:t=fill,\
              drawbox=x=0:y=358:w=1280:h=4:color=#00aaff@0.9:t=fill,\
              hue=h=12:s=1.08:b=0.02,eq=contrast=1.06:brightness=0.01,\
              drawbox=x=0:y=0:w=1280:h=6:color=white@0.45:t=fill,\
              drawbox=x=0:y=714:w=1280:h=6:color=white@0.45:t=fill,\
              drawbox=x=0:y=0:w=6:h=720:color=white@0.45:t=fill,\
              drawbox=x=1274:y=0:w=6:h=720:color=white@0.45:t=fill,\
              drawbox=x='if(lt(mod(t*360,4000),1280),mod(t*360,4000),if(lt(mod(t*360,4000),2000),1274,if(lt(mod(t*360,4000),3280),1280-(mod(t*360,4000)-2000),0)))':y='if(lt(mod(t*360,4000),1280),0,if(lt(mod(t*360,4000),2000),(mod(t*360,4000)-1280),if(lt(mod(t*360,4000),3280),714,720-(mod(t*360,4000)-3280))))':w='if(lt(mod(t*360,4000),2000),90,6)':h='if(lt(mod(t*360,4000),2000),6,90)':color=cyan@0.95:t=fill[v_base];\
              [2:v]scale=460:92:force_original_aspect_ratio=decrease,pad=460:92:(ow-iw)/2:(oh-ih)/2:color=black@0.0,format=rgba[logo_scaled];\
              [v_base][logo_scaled]overlay=x=810:y=22:shortest=1[v];\
              anoisesrc=color=white:amplitude=0.025:sample_rate=44100[bgnoise];\
              [1:a]highpass=f=80,lowpass=f=2100,bass=g=14:f=100:w=0.9,vibrato=f=4.5:d=0.45,aecho=in_gain=0.9:out_gain=0.95:delays=95|165|240:decays=0.65|0.5|0.35,asetrate=44100*0.72,atempo=1.3888,aresample=44100:async=1:first_pts=0[main_a];\
              [main_a][bgnoise]amix=inputs=2:weights='1 0.22':duration=shortest,asetpts=PTS-STARTPTS[a]" \
              -map "[v]" -map "[a]" \
              -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1600k -maxrate 1900k -bufsize 3600k \
              -max_muxing_queue_size 4096 \
              -c:a aac -b:a 112k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -rtmp_live live \
              -flvflags no_duration_filesize \
              -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}" || true
            echo "Stream ended or dropped, reconnecting in 1s..."
            sleep 1
          done
          FFEOF

          bash run_stream.sh
          
