name: Stream PTV Sports to Kick (Working Structure)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Set a real desktop Chrome User-Agent
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36');

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/5383', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            await page.evaluate(async () => {
              window.open = function() { return null; };

              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span, li'));
              const ptvBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('ptv sports'));
              
              if (ptvBtn) {
                ptvBtn.click();
              }

              await new Promise(resolve => setTimeout(resolve, 4000));

              // Monitor video playback continuously to prevent freezes or pauses
              setInterval(() => {
                const video = document.querySelector('video');
                if (video) {
                  if (video.paused) {
                    video.play().catch(() => {});
                  }
                  video.muted = false;
                  video.volume = 1.0;
                }
              }, 1000);

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # Clean FFmpeg Streaming with Virtual Sink and Kick/IVS RTMPS endpoint
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize+no_metadata \
            -f flv "rtmps://fa723fc1b171.global-contribute.live-video.net:443/app/sk_us-west-2_5pe0dOCLoCrz_FnAVd9FoD0vc5x8CjJ552JPX57agTV"
