name: Stream Touchcric Match to Facebook (Lower Down Logo)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl
            
          npm install puppeteer

      - name: Start Virtual Display & Launch Puppeteer
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start || true
          pactl load-module module-null-sink sink_name=my_sink || true
          pactl set-default-sink my_sink || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/4527', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            // PTV Sports සර්වර් බටන් එක සොයා ක්ලික් කිරීම සහ ප්ලේයර් එක ෆුල්ස්ක්‍රීන් කිරීම
            await page.evaluate(async () => {
              window.open = function() { return null; };
              await new Promise(resolve => setTimeout(resolve, 2000));

              const buttons = Array.from(document.querySelectorAll('a, button, div'));
              const ptvButton = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('ptv'));
              if (ptvButton) {
                ptvButton.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          ffmpeg -y \
            -fflags nobuffer -flags low_delay \
            -f x11grab -framerate 25 -video_size 1280x720 -i :99.0 \
            -f alsa -ar 44100 -channels 2 -i default \
            -map_metadata -1 \
            -filter_complex "[0:v]crop=in_w-30:in_h-30:15:15,scale=1280:720,eq=brightness=0.07:contrast=1.9:saturation=1.5:gamma=1.2,hue=h=30:s=1.3,noise=alls=40:allf=t+u,fps=24.97,\
            drawtext=text='LIVE CRICKET':x='mod(t*60, w+200)-100':y=h-30:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-280:y=48:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.9:boxborderw=10,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text=' PLEASE SHARE & LIKE ':x=50:y='150 + sin(t*5)*12':fontsize=26:fontcolor=yellow:box=1:boxcolor=blue@0.8:boxborderw=6[v]; \
            [1:a]highpass=f=150,lowpass=f=3400,asetrate=44100*1.25,aresample=44100:async=1,atempo=0.8,aecho=0.8:0.88:60:0.4,volume=1.0[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1000k -maxrate 1200k -bufsize 2400k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -rw_timeout 20000000 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 5 \
            -reconnect_at_eof 1 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            
