name: Stream Match to Facebook (Azure Kernel Compatible)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            console.log("Navigating to site...");
            await page.goto('https://footfytv.pro/watch/4726', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            console.log("Waiting for player to load...");
            await new Promise(r => setTimeout(r, 10000));

            await page.evaluate(async () => {
              window.open = function() { return null; };

              const elements = Array.from(document.querySelectorAll('button, a, div, span, li'));
              const targetBtn = elements.find(el => el.textContent && el.textContent.toLowerCase().includes('sonyliv'));
              
              if (targetBtn) {
                targetBtn.click();
                console.log("Clicked FanCode FHD button");
              }

              await new Promise(resolve => setTimeout(resolve, 5000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = true; // Browser eke video eka mute කර ඇත
                video.style.position = 'fixed';
                video.style.top = '0';
                video.style.left = '0';
                video.style.width = '1280px';
                video.style.height = '720px';
                video.style.zIndex = '999999';
                video.style.objectFit = 'cover';
                
                video.play().catch(e => {});
              }
            });

            await new Promise(() => {});
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 25

          # Advanced Anti-Copyright FFmpeg Pipeline with Custom Watermark & Logo Shields
          ffmpeg -y \
            -f x11grab -framerate 25 -video_size 1280x720 -i :99.0 \
            -f lavfi -i "anoisesrc=d=999999:c=white:r=44100:amplitude=0.01" \
            -filter_complex "[0:v]crop=in_w-32:in_h-32:16:16,scale=1280:720,fps=25,\
            eq=brightness='0.02*sin(t/3)':contrast='1.04+0.03*cos(t/4)':saturation='1.07',\
            noise=alls=15:allf=t+u,\
            drawbox=x=0:y=0:w=1280:h=10:color=black@0.5:t=fill,\
            drawbox=x=0:y=710:w=1280:h=10:color=black@0.5:t=fill,\
            \
            drawbox=x=15:y=15:w=220:h=55:color=black@0.95:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='OFFICIAL BROADCAST':x=15+(220-text_w)/2:y=15+(55-text_h)/2:fontsize=15:fontcolor=white,\
            \
            drawbox=x=900:y=35:w=360:h=60:color=black@0.95:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='JACOB SUPER HD':x=900+(360-text_w)/2:y=35+(60-text_h)/2:fontsize=20:fontcolor=yellow,\
            \
            drawtext=text='LIVE STREAM ONGOING':x='mod(t*60, w+300)-150':y=h-22:fontsize=16:fontcolor=white@0.9:box=1:boxcolor=black@0.6:boxborderw=2,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-105:y=105:fontsize=15:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=2,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SUPPORT US • SHARE':x=20:y='110 + sin(t*3)*10':fontsize=18:fontcolor=cyan:box=1:boxcolor=black@0.7:boxborderw=3[v]" \
            -map "[v]" -map 1:a \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 550k -maxrate 750k -bufsize 1500k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 64k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            
