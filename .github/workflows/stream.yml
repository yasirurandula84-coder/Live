name: Restream Facebook Live via Auto-Login Puppeteer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl
            
          npm install puppeteer

          curl -L -o bgmusic.mp3 "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"

      - name: Start Virtual Display & Auto-Login Stream via Puppeteer
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASS: ${{ secrets.FB_PASS }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--disable-notifications'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // 1. Facebook Login
            console.log('Navigating to Facebook login...');
            await page.goto('https://www.facebook.com/login', {
              waitUntil: 'networkidle2'
            });

            await page.type('#email', process.env.FB_EMAIL, { delay: 50 });
            await page.type('#pass', process.env.FB_PASS, { delay: 50 });
            await page.click('#loginbutton');
            
            await new Promise(r => setTimeout(r, 10000));
            console.log('Login completed. Going to target video link...');

            // 2. Target Video Link (Shared Post)
            await page.goto('https://www.facebook.com/61576526910808/posts/122133871064884230/?mibextid=rS40aB7S9Ucbxw6v', {
              waitUntil: 'networkidle2'
            });

            // වීඩියෝව පූර්ණ ලෙස ලෝඩ් වීමට තත්පර 15ක් ඉඳීම
            await new Promise(r => setTimeout(r, 15000));

            // 3. වීඩියෝ ප්ලේයර් එක මත ක්ලික් කර ප්ලේ කිරීම සහ Fullscreen කිරීම
            await page.evaluate(async () => {
              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
              }
              const videoContainer = document.querySelector('div[role="region"]') || document.querySelector('video');
              if (videoContainer) {
                videoContainer.click();
              }
            });

            // තවත් තත්පර 5ක් ඉඳලා F11 ගැසීම
            await new Promise(r => setTimeout(r, 5000));
            await page.keyboard.press('F11');
            
            console.log('Stream display setup completed.');
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 25

          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i default \
            -stream_loop -1 -i bgmusic.mp3 \
            -map_metadata -1 \
            -filter_complex "[0:v]crop=in_w-20:in_h-20:10:10,scale=1280:720,eq=brightness=0.05:contrast=1.85:saturation=1.45:gamma=1.15,hue=h=25:s=1.25,noise=alls=35:allf=t+u,fps=29.97,\
            drawtext=text='LIVE CRICKET':x='mod(t*60, w+200)-100':y=h-30:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-270:y=28:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.9:boxborderw=8,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=W-270:y='if(lt(mod(t,10),1), -30+58*mod(t,10), 28)':fontsize=24:fontcolor=white:alpha='if(lt(mod(t,10),1), mod(t,10), if(lt(mod(t,10),9), 1, 1-(mod(t,10)-9)))'[v]; \
            [1:a]asetrate=44100*1.18,aresample=44100,volume=1.0[main_audio]; \
            [2:a]volume=0.08[bg_audio]; \
            [main_audio][bg_audio]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1400k -maxrate 1600k -bufsize 3200k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
