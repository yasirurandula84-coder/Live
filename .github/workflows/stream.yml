name: Stream Yonotv to Telegram Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--disable-web-security',
                '--allow-running-insecure-content'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Real user agent
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36');

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            console.log("Navigating to Yonotv link...");
            await page.goto('https://yonotv.pages.dev/page?src=https://yonotv.pages.dev/LINK?id=IND', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log("Waiting for player to render...");
            await new Promise(r => setTimeout(r, 10000));

            // Force play and style video to fullscreen
            await page.evaluate(async () => {
              window.open = function() { return null; };

              setInterval(() => {
                const video = document.querySelector('video');
                if (video) {
                  if (video.paused) {
                    video.play().catch(() => {});
                  }
                  video.muted = false;
                  video.volume = 1.0;
                }
              }, 1000);

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.style.position = 'fixed';
                video.style.top = '0';
                video.style.left = '0';
                video.style.width = '1280px';
                video.style.height = '720px';
                video.style.zIndex = '999999';
                video.style.objectFit = 'cover';
                
                video.play().catch(e => {});

                if (video.requestFullscreen) {
                  video.requestFullscreen().catch(() => {});
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 20

                              # Fully Synchronized FFmpeg Streaming Pipeline for Telegram RTMPS
          ffmpeg -y \
            -fflags +genpts \
            -thread_queue_size 2048 -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -thread_queue_size 2048 -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -fps_mode cfr \
            -max_muxing_queue_size 4096 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 -async 1 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize+no_metadata \
            -f flv "rtmps://dc4-1.rtmp.t.me/s/4363232898:B2Az5dt8l-5vdB9h-B42Gw"
