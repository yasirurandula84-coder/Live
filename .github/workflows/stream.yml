name: Stream Match to Facebook (Azure Kernel Compatible)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/4726', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            await page.evaluate(async () => {
              window.open = function() { return null; };

              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span, li'));
              const sonylivBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('sonyliv'));
              
              if (sonylivBtn) {
                sonylivBtn.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # FFmpeg streaming - Fixed eq quotes error
          ffmpeg -y \
            -f x11grab -framerate 24 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -map_metadata -1 \
            -filter_complex "[0:v]crop=1280:680:0:40,\
            zoompan=z='if(lt(mod(t,20),10), 1.0 + (mod(t,10)/10)*0.03, 1.03 - ((mod(t,10)/10)*0.03))':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1280:720:fps=24,\
            eq=brightness=\'0.04+0.03*sin(t/0.8)\':contrast=\'1.12+0.06*cos(t/1.2)\':saturation=\'1.15+0.08*sin(t/1.5)\':gamma=\'1.08+0.05*cos(t/1.0)\',\
            unsharp=5:5:1.0:5:5:0.0,\
            noise=alls=35:allf=t+u,\
            drawtext=text='@':x='mod(t*150, w)':y='mod(t*120, h)':fontsize=12:fontcolor=white@0.05,\
            drawtext=text='-':x='mod(t*200, w)':y='mod(t*180, h)':fontsize=12:fontcolor=black@0.05,\
            \
            drawbox=x=980:y=20:w=140:h=90:color=blue:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LIVE':x=980+(140-text_w)/2:y=20+(90-text_h)/2:fontsize=24:fontcolor=yellow,\
            \
            drawbox=x=1120:y=20:w=140:h=90:color=blue:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPORT':x=1120+(140-text_w)/2:y='20 + if(lt(mod(t,10),2), (mod(t,10)/2)*15, 0)':fontsize=24:fontcolor=red,\
            \
            drawbox=x=980:y=115:w=280:h=35:color=black@0.9:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='🔴 HD BROADCAST':x=980+(280-text_w)/2:y=115+(35-text_h)/2:fontsize=16:fontcolor=yellow,\
            drawtext=text='LIVE STREAM ONGOING':x='mod(t*55, w+200)-100':y=h-35:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LIKE & SHARE THE STREAM':x=50:y='150 + sin(t*5)*12':fontsize=26:fontcolor=yellow:box=1:boxcolor=blue@0.8:boxborderw=6,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='⚡ OFFICIAL STREAM LINK • ENJOY ⚡':x='w-mod(t*80, w+800)':y=15:fontsize=16:fontcolor=cyan:box=1:boxcolor=black@0.8:boxborderw=4,\
            drawtext=text='STREAM ID\: %{frame_num}':x=50:y=20:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.6[v]; \
            [0:a]highpass=f=350,lowpass=f=2700,asetrate=44100*1.22,atempo=0.82,aecho=0.8:0.88:80:0.3,volume=1.2[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 550k -maxrate 750k -bufsize 1500k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 96k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            
