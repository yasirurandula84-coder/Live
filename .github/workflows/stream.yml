name: Stream Match to Facebook (Black Screen Fix + FootfyTV 5928)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget

          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 --log-target=syslog || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true
          pactl set-default-source virtual_speaker.monitor || true

          curl -fsSL "https://raw.githubusercontent.com/yasirurandula84-coder/Live/refs/heads/main/1793782216727.jpg" -o logo.jpg || \
            ffmpeg -y -f lavfi -i color=c=black:s=420x84:d=1 -frames:v 1 logo.jpg

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          const TARGET_URL = 'https://footfytv.my/match.php?id=5928';

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            page.on('console', (msg) => {
              console.log('[PAGE CONSOLE]:', msg.text());
            });
            page.on('pageerror', (err) => {
              console.log('[PAGE ERROR]:', err.message);
            });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close().catch(() => {});
                }
              }
            });

            await page.evaluateOnNewDocument(() => {
              window.open = function () { return null; };
            });

            let tried540Once = false;

            async function loadMatchPage() {
              console.log('Navigating to match stream...');
              tried540Once = false;
              try {
                await page.goto(TARGET_URL, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                console.log('Loaded URL:', page.url());
              } catch (e) {
                console.log('Navigation error:', e.message);
              }
            }

            await loadMatchPage();

            async function select540pIfAvailable(frame) {
              return frame.evaluate(() => {
                let selected540p = false;

                const selects = Array.from(document.querySelectorAll('select'));
                for (const sel of selects) {
                  for (const opt of Array.from(sel.options)) {
                    const txt = ((opt.textContent || '') + ' ' + (opt.value || '')).toLowerCase();
                    if (txt.includes('540p') || txt.includes('540')) {
                      sel.value = opt.value;
                      sel.dispatchEvent(new Event('change', { bubbles: true }));
                      selected540p = true;
                    }
                  }
                }

                const candidates = Array.from(
                  document.querySelectorAll('button, [role="menuitem"], [role="option"], li')
                );
                for (const el of candidates) {
                  const ownText = (el.textContent || '').trim().toLowerCase();
                  if (ownText === '540p' || ownText === '540') {
                    try {
                      el.click();
                      selected540p = true;
                    } catch (e) {}
                  }
                }

                return selected540p;
              }).catch(() => false);
            }

            let lastProgressTime = -1;
            let stuckTicks = 0;
            let noVideoTicks = 0;

            async function ensureFullscreenAutoPlayInFrames() {
              const frames = page.frames();
              let anyVideoFound = false;
              let maxCurrentTime = -1;
              let maxReadyState = 0;

              for (let i = 0; i < frames.length; i++) {
                let q540 = false;
                if (!tried540Once) {
                  q540 = await select540pIfAvailable(frames[i]);
                }

                const info = await frames[i].evaluate(async (frameIdx, picked540) => {
                  window.open = function () { return null; };

                  const styleId = 'force-clean-fullscreen-style';
                  if (!document.getElementById(styleId)) {
                    const style = document.createElement('style');
                    style.id = styleId;
                    style.textContent = `
                      html, body {
                        margin: 0 !important;
                        padding: 0 !important;
                        width: 1280px !important;
                        height: 720px !important;
                        overflow: hidden !important;
                        background: #000 !important;
                      }
                      iframe, video {
                        position: fixed !important;
                        top: 0 !important;
                        left: 0 !important;
                        width: 1280px !important;
                        height: 720px !important;
                        max-width: 1280px !important;
                        max-height: 720px !important;
                        z-index: 2147483647 !important;
                        background: #000 !important;
                        object-fit: contain !important;
                      }
                    `;
                    (document.head || document.documentElement).appendChild(style);
                  }

                  const videos = Array.from(document.querySelectorAll('video'));
                  for (const v of videos) {
                    v.muted = false;
                    v.volume = 1.0;
                    v.controls = false;
                    v.preload = 'auto';
                    v.playbackRate = 1.0;
                    v.disablePictureInPicture = true;
                    v.style.position = 'fixed';
                    v.style.top = '0';
                    v.style.left = '0';
                    v.style.width = '1280px';
                    v.style.height = '720px';
                    v.style.zIndex = '2147483647';
                    v.style.objectFit = 'contain';
                    try {
                      if (v.paused || v.ended) {
                        await v.play();
                      }
                    } catch (e) {}
                  }

                  return {
                    frameIdx,
                    picked540,
                    videos: videos.length,
                    paused: videos.map((v) => v.paused),
                    currentTimes: videos.map((v) => Number((v.currentTime || 0).toFixed(2))),
                    readyStates: videos.map((v) => v.readyState),
                    networkStates: videos.map((v) => v.networkState)
                  };
                }, i, q540).catch((e) => ({ frameIdx: i, err: e.message }));

                console.log('[PLAYER SYNC]:', JSON.stringify(info));

                if (info && info.videos > 0) {
                  anyVideoFound = true;
                  for (const ct of info.currentTimes || []) {
                    if (ct > maxCurrentTime) maxCurrentTime = ct;
                  }
                  for (const rs of info.readyStates || []) {
                    if (rs > maxReadyState) maxReadyState = rs;
                  }
                }
              }

              if (!anyVideoFound) {
                noVideoTicks += 1;
                console.log('[WATCHDOG]: No video element found, noVideoTicks =', noVideoTicks);
                if (noVideoTicks >= 6) {
                  noVideoTicks = 0;
                  await loadMatchPage();
                }
                return;
              }

              noVideoTicks = 0;
              tried540Once = true;

              if (maxCurrentTime >= 0) {
                if (Math.abs(maxCurrentTime - lastProgressTime) < 0.05 || maxReadyState < 2) {
                  stuckTicks += 1;
                  console.log('[WATCHDOG]: Match video stalled/black, stuckTicks =', stuckTicks, 'readyState =', maxReadyState);
                } else {
                  stuckTicks = 0;
                  lastProgressTime = maxCurrentTime;
                }

                if (stuckTicks === 2) {
                  console.log('[WATCHDOG]: Reloading video source and forcing play()...');
                  for (const frame of page.frames()) {
                    await frame.evaluate(() => {
                      document.querySelectorAll('video').forEach((v) => {
                        try {
                          if (v.readyState < 2) {
                            v.load();
                          } else if (v.buffered && v.buffered.length > 0 && isFinite(v.duration)) {
                            const end = v.buffered.end(v.buffered.length - 1);
                            if (end - v.currentTime > 1.5 && end - v.currentTime < 15) {
                              v.currentTime = end - 0.5;
                            }
                          }
                        } catch (e) {}
                        v.play().catch(() => {});
                      });
                    }).catch(() => {});
                  }
                } else if (stuckTicks >= 4) {
                  console.log('[WATCHDOG]: Match video black/frozen too long, reloading page...');
                  stuckTicks = 0;
                  lastProgressTime = -1;
                  await loadMatchPage();
                }
              }
            }

            await new Promise((r) => setTimeout(r, 10000));
            await ensureFullscreenAutoPlayInFrames();
            setInterval(ensureFullscreenAutoPlayInFrames, 3000);

            await new Promise(() => {});
          })();
          EOF

          node launch.js > launch.log 2>&1 &
          sleep 45
          echo "=== LAUNCH.JS LOGS ==="
          cat launch.log || true
          echo "======================"

          cat << 'FFEOF' > run_stream.sh
          #!/usr/bin/env bash
          while true; do
            ffmpeg -y \
              -fflags +genpts+igndts \
              -thread_queue_size 4096 \
              -f x11grab -use_wallclock_as_timestamps 1 -framerate 20 -video_size 1280x720 -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse -i virtual_speaker.monitor \
              -loop 1 -i logo.jpg \
              -filter_complex "\
              color=c=black:s=1280x720:r=20[bg];\
              [0:v]scale=1320:742,fps=20,\
              crop=w=1280:h=720:x='20+14*sin(t*0.45)':y='11+10*cos(t*0.38)',\
              split=2[vtop_raw][vbot_raw];\
              [vtop_raw]crop=1280:615:0:0,split=2[vleft][vright];\
              [vleft]crop=640:615:0:0,hue=h=-25:s=1.15,colorbalance=rs=0.12:gs=-0.04:bs=0.08:rm=0.08:gm=-0.02:bm=0.06[left_tinted];\
              [vright]crop=640:615:640:0,hue=h=35:s=1.15,colorbalance=rs=-0.06:gs=0.10:bs=-0.04:rm=-0.04:gm=0.07:bm=-0.02[right_tinted];\
              color=c=black:s=1280x615:r=20[top_bg];\
              [top_bg][left_tinted]overlay=0:0:shortest=1[top_half];\
              [top_half][right_tinted]overlay=640:0:shortest=1,\
              perspective=x0=55:y0=0:x1=1225:y1=0:x2=-45:y2=615:x3=1325:y3=615:sense=destination,\
              scale=1304:627,\
              rotate='0.0075*sin(t*0.5)':fillcolor=black@0:ow=1304:oh=627,\
              crop=1280:615:(iw-1280)/2:(ih-615)/2[top_tilted];\
              [vbot_raw]crop=1280:105:0:615[bot_straight];\
              [bg][bot_straight]overlay=0:615:shortest=1[with_bot];\
              [with_bot][top_tilted]overlay=0:0:shortest=1,\
              drawbox=x=0:y=0:w=1280:h=4:color=white@0.22:t=fill,\
              drawbox=x=0:y=716:w=1280:h=4:color=white@0.22:t=fill,\
              drawbox=x=0:y=0:w=4:h=720:color=white@0.22:t=fill,\
              drawbox=x=1276:y=0:w=4:h=720:color=white@0.22:t=fill,\
              drawbox=x='mod(140+t*45,1260)':y='120+45*sin(t*0.7+0.0)':w=4:h=4:color=white@0.045:t=fill,\
              drawbox=x='mod(310+t*45,1260)':y='190+45*sin(t*0.7+1.1)':w=4:h=4:color=white@0.045:t=fill,\
              drawbox=x='mod(480+t*45,1260)':y='260+45*sin(t*0.7+2.2)':w=4:h=4:color=white@0.045:t=fill,\
              drawbox=x='mod(650+t*45,1260)':y='330+45*sin(t*0.7+3.3)':w=4:h=4:color=white@0.045:t=fill,\
              drawbox=x='mod(820+t*45,1260)':y='260+45*sin(t*0.7+4.4)':w=4:h=4:color=white@0.045:t=fill,\
              drawbox=x='mod(990+t*45,1260)':y='190+45*sin(t*0.7+5.5)':w=4:h=4:color=white@0.045:t=fill,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='STREAMX LIVE':x='(w-text_w)/2+110*sin(t*0.35)':y='(h-text_h)/2-35+45*cos(t*0.28)':fontsize=26:fontcolor=white@0.26[v_base];\
              [2:v]scale=420:84:force_original_aspect_ratio=decrease,pad=420:84:(ow-iw)/2:(oh-ih)/2:color=black@0.0,format=rgba[logo_scaled];\
              [v_base][logo_scaled]overlay=x=890:y=20:shortest=1[v];\
              anoisesrc=color=pink:amplitude=0.015:sample_rate=44100[amb_tex];\
              [1:a]adelay=2500|2500,highpass=f=75,lowpass=f=2400,\
              equalizer=f=320:t=q:w=1.5:g=-3,equalizer=f=1450:t=q:w=1.2:g=2.5,\
              bass=g=10:f=110:w=0.8,\
              asetrate=44100*0.78,atempo=1.282,aresample=44100:async=1000:first_pts=0[main_a];\
              [main_a][amb_tex]amix=inputs=2:weights='1 0.16':duration=shortest:dropout_transition=3,asetpts=PTS-STARTPTS[a]" \
              -map "[v]" -map "[a]" \
              -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 40 -keyint_min 40 -b:v 1200k -maxrate 1400k -bufsize 2600k \
              -max_muxing_queue_size 8192 \
              -c:a aac -b:a 112k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -rtmp_live live \
              -flvflags no_duration_filesize \
              -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}" || true
            echo "Stream ended or dropped, reconnecting in 3s..."
            sleep 3
          done
          FFEOF

          bash run_stream.sh
