name: Stream Match to Kick (Clean HD)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            console.log("Navigating to site...");
            await page.goto('https://footfytv.pro/watch/5383', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            console.log("Waiting for player to load automatically...");
            await new Promise(r => setTimeout(r, 10000));

            // Auto-detect video, force play, and fit fullscreen without clicking buttons
            await page.evaluate(async () => {
              window.open = function() { return null; };

              const videos = document.querySelectorAll('video');
              let mainVideo = videos[0];
              
              if (videos.length > 1) {
                let maxSize = 0;
                videos.forEach(v => {
                  const rect = v.getBoundingClientRect();
                  const size = rect.width * rect.height;
                  if (size > maxSize) {
                    maxSize = size;
                    mainVideo = v;
                  }
                });
              }

              if (mainVideo) {
                mainVideo.muted = false;
                mainVideo.style.position = 'fixed';
                mainVideo.style.top = '0';
                mainVideo.style.left = '0';
                mainVideo.style.width = '1280px';
                mainVideo.style.height = '720px';
                mainVideo.style.zIndex = '999999';
                mainVideo.style.objectFit = 'cover';
                
                mainVideo.play().catch(e => {});

                if (mainVideo.requestFullscreen) {
                  mainVideo.requestFullscreen().catch(() => {});
                }
              }
            });

            await new Promise(() => {});
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 25

          # Clean FFmpeg Pipeline with Kick/IVS RTMP parameters (No filters, No audio effects)
          cat << 'FFEOF' > run_stream.sh
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f alsa -i default \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 2000k -maxrate 2500k -bufsize 5000k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize+no_metadata \
            -f flv "rtmps://fa723fc1b171.global-contribute.live-video.net:443/app/sk_us-west-2_5pe0dOCLoCrz_FnAVd9FoD0vc5x8CjJ552JPX57agTV"
          FFEOF

          bash run_stream.sh
          
