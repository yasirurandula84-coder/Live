name: Stream FanCode via Browser to Livepush

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core
            
          npm install puppeteer

      - name: Run Stream Bot & FFmpeg Capture
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          # PulseAudio Setup
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink sink_properties=device.description=Virtual_Sink || true
          pactl set-default-sink virtual_sink || true
          
          sleep 2
          SINK_MONITOR=$(pactl list sources short | grep virtual_sink | awk '{print $2}')

          # Create Puppeteer script to launch FanCode match
          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // Go to FanCode Match Page
            await page.goto('https://fancode.com/', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 6000));
            
            // Navigate to your match directly
            await page.goto('https://fancode.com/match/4250368', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 8000));

            // Auto click play & fullscreen video
            await page.evaluate(async () => {
              window.open = function() { return null; };
              const playBtns = Array.from(document.querySelectorAll('button, div, span')).filter(el => el.textContent && (el.textContent.toLowerCase().includes('watch') || el.textContent.toLowerCase().includes('stream') || el.textContent.toLowerCase().includes('live')));
              if(playBtns.length > 0) playBtns[0].click();

              await new Promise(resolve => setTimeout(resolve, 4000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                if (video.requestFullscreen) video.requestFullscreen();
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 15

          # FFmpeg captures the virtual screen & original audio and sends to Livepush
          ffmpeg -y \
            -f x11grab -framerate 24 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://stream.livepush.io/live/rtmp_ef89878a908e457691eda888602a67ee"
            
