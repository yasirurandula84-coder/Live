name: Stream Match to Facebook (Voice Effects Only)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            pavucontrol \
            fonts-dejavu-core \
            curl
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/4527', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            await page.evaluate(async () => {
              window.open = function() { return null; };

              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span, li'));
              const ptvBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('ptv'));
              
              if (ptvBtn) {
                ptvBtn.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 18

          # FFmpeg ස්ට්‍රීම් කිරීම (පසුබිම් සංගීතය ඉවත් කර, හඬ පමණක් Chipmunk සහ Echo ලෙස වෙනස් කර ඇත)
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -map_metadata -1 \
            -filter_complex "[0:v]crop=in_w-30:in_h-30:15:15,scale=1280:720,eq=brightness=0.02:contrast=1.08:saturation=1.05:gamma=1.0,fps=29.97,\
            drawbox=x=1010:y=70:w=250:h=75:color=black:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPECTRUM SPORTS':x=1010+(250-text_w)/2:y=70+(75-text_h)/2:fontsize=18:fontcolor=white,\
            drawtext=text='LIVE CRICKET MATCH':x='mod(t*60, w+200)-100':y=h-30:fontsize=22:fontcolor=white@0.9:box=1:boxcolor=black@0.7:boxborderw=3,\
            drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-130:y=60:fontsize=20:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=5,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SHARE NOW & LIKE THE STREAM':x=50:y='150 + sin(t*5)*12':fontsize=26:fontcolor=yellow:box=1:boxcolor=blue@0.8:boxborderw=6,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='⚡ OFFICIAL HD BROADCAST • JOIN WITH US ⚡':x='w-mod(t*100, w+800)':y=15:fontsize=16:fontcolor=cyan:box=1:boxcolor=black@0.8:boxborderw=4,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MATCH CONTINUOUSLY LIVE':x=50:y=h-70:fontsize=16:fontcolor=white:box=1:boxcolor=green@0.8:boxborderw=4[v]; \
            [1:a]asetrate=44100*1.18,aresample=44100,atempo=0.85,aecho=0.8:0.88:60|120:0.4|0.3,volume=1.5[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 700k -maxrate 900k -bufsize 1800k \
            -max_muxing_queue_size 4096 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -rw_timeout 30000000 \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 10 \
            -reconnect_at_eof 1 \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
            
