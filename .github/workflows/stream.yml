name: Live View 1xBet Stream (No Download Needed)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget \
            x11vnc \
            novnc \
            websockify
            
          npm install puppeteer

      - name: Start Virtual Display & Live Viewer
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          # PulseAudio Setup
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink sink_properties=device.description=Virtual_Sink || true
          pactl set-default-sink virtual_sink || true
          
          sleep 2
          SINK_MONITOR=$(pactl list sources short | grep virtual_sink | awk '{print $2}')
          echo "Using audio source: $SINK_MONITOR"

          # Start noVNC web server to view screen via browser
          websockify --web /usr/share/novnc/ 6080 localhost:5900 > /dev/null 2>&1 &
          x11vnc -display :99 -forever -nopw -listen localhost -port 5900 > /dev/null 2>&1 &

          # Download and run ngrok to get a public link
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

          # (ඔබ ngrok token එකක් දමාගැනීම වඩාත් හොඳය, නැතහොත් පහත command එකෙන් නිදහස් ලින්ක් එකක් ලබා දේ)
          # ngrok authtoken YOUR_NGROK_AUTH_TOKEN
          ngrok http 6080 > /dev/null 2>&1 &
          
          # Get ngrok public URL
          sleep 4
          NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'https://[^"]*ngrok-free.app')
          echo "====================================================="
          echo "🌐 LIVE STREAM VIEWING URL: $NGROK_URL/vnc.html?autoconnect=true"
          echo "====================================================="

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            // 1xBet Login
            await page.goto('https://lk.1x-bet.mobi/en/user/login', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 4000));

            await page.type('input[type="text"], input[name*="login"], input[name*="user"], input[name*="id"]', '1866534535', { delay: 50 });
            await page.type('input[type="password"]', 'Barman9agenda3Handed-', { delay: 50 });
            await new Promise(r => setTimeout(r, 2000));

            await page.evaluate(() => {
              const buttons = Array.from(document.querySelectorAll('button'));
              const loginBtn = buttons.find(b => b.textContent && (b.textContent.toLowerCase().includes('log') || b.textContent.toLowerCase().includes('enter')));
              if (loginBtn) loginBtn.click();
            });

            await new Promise(r => setTimeout(r, 8000));

            // Go to Match
            await page.goto('https://lk.1x-bet.mobi/en/live/cricket/2791573-nepal-premier-league/768167482-lumbini-lions-janakpur-bolts', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 6000));

            await page.evaluate(async () => {
              window.open = function() { return null; };
              const playBtns = Array.from(document.querySelectorAll('button, div, span')).filter(el => el.textContent && el.textContent.toLowerCase().includes('stream'));
              if(playBtns.length > 0) playBtns[0].click();

              await new Promise(resolve => setTimeout(resolve, 3000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                if (video.requestFullscreen) video.requestFullscreen();
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 25

          # FFmpeg streaming/recording
          ffmpeg -y \
            -f x11grab -framerate 24 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -map_metadata -1 \
            -filter_complex \
            "[0:v]crop=1280:680:0:40,\
            scale=1260:670,\
            pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,\
            eq=brightness=0.04:contrast=1.08:saturation=1.05,\
            noise=alls=25:allf=t+u,\
            drawbox=x=1130:y=15:w=140:h=90:color=blue:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LIVE':x=1165:y=48:fontsize=24:fontcolor=yellow,\
            drawbox=x=980:y=115:w=280:h=35:color=black@0.9:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='🔴 HD BROADCAST':x=990:y=122:fontsize=16:fontcolor=yellow,\
            drawtext=text='PLEASE FOLLOW MY PAGE':x=350:y=350:fontsize=36:fontcolor=yellow:box=1:boxcolor=black@0.8:boxborderw=5[v]; \
            [1:a]highpass=f=200,lowpass=f=3000,asetrate=44100*1.4,atempo=0.71,aecho=0.8:0.88:100:0.4,volume=1.5[a]" \
            -map "[v]" -map "[a]" \
            -t 300 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k test_stream.mp4
