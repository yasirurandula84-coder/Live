name: YouTube Live Streamer

on:
  workflow_dispatch: # GitHub ඩෑෂ්බෝඩ් එකෙන් Manual එකෙන් "Run workflow" ක්ලික් කරලා ලයිව් එක පටන් ගන්න

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Live Stream to YouTube
        env:
          PORT: 3000
        run: |
          # සර්වර් එක බැක්ග්‍රවුන්ඩ් එකේ රන් වෙන්න හැදීම
          node server.js &
          
          # සර්වර් එක ස්ටාර්ට් වෙන්න තත්පර 5ක් ඉඳලා රික්වෙස්ට් එක යැවීම
          sleep 5
          
          # යූටියුබ් ලයිව් රූට් එකට රික්වෙස්ට් එක යැවීම සහ GitHub Secret එක භාවිත කිරීම
          curl -X POST http://localhost:3000/start-yt-live \
            -H "Content-Type: application/json" \
            -d '{"streamKey": "${{ secrets.YT_STREAM_KEY }}"}'
          
          # ලයිව් එක දිගටම දුවන්න කල් දීම (පැය 6ක් දක්වා)
          sleep 21600
