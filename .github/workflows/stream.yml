name: Custom Live Streamer

on:
  workflow_dispatch: 

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        env:
          PORT: 3000
        run: |
          node server.js &
          sleep 5
          
          curl -X POST http://localhost:3000/start-live
          
          sleep 21600
