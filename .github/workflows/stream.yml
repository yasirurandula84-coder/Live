name: Stream Footfytv to Rumble (Remove Overlay & HD)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1920,1080',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            // Target URL
            await page.goto('https://footfytv.pro/watch/5383', {
              waitUntil: 'networkidle2'
            });

            // Wait for elements to appear
            await new Promise(r => setTimeout(r, 6000));

            // Remove footylive overlay/watermark, click play, unmute, and fullscreen
            await page.evaluate(async () => {
              window.open = function() { return null; };

              // Remove any overlays or footylive branding elements without refreshing
              const overlays = document.querySelectorAll('div, img, span');
              overlays.forEach(el => {
                if (el.innerText && el.innerText.toLowerCase().includes('footylive')) {
                  el.remove();
                }
                // Also check by class or style if needed
                if (el.className && typeof el.className === 'string' && el.className.includes('footy')) {
                  el.remove();
                }
              });

              // Click play button
              const playButton = document.querySelector('video, .jw-icon-playback, .vjs-big-play-button, .play-button, button, div[class*="play"]');
              if (playButton) {
                playButton.click();
              }

              await new Promise(resolve => setTimeout(resolve, 3000));

              // Unmute and Fullscreen video
              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 20

          # FFmpeg streaming with Full HD resolution to Rumble RTMP
          while true; do
            echo "Starting/Restarting HD FFmpeg stream to Rumble..."
            ffmpeg -y \
              -f x11grab -framerate 30 -video_size 1920x1080 -i :99.0 \
              -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
              -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 3000k -maxrate 4000k -bufsize 8000k \
              -c:a aac -b:a 192k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -flvflags no_duration_filesize \
              -f flv "rtmp://studio-rtmp.rumble.com/live/s-4qyu6y-3utn-tqvf-0f5049" || true
            
            echo "Stream disconnected. Reconnecting in 3 seconds..."
            sleep 3
          done
