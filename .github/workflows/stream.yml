name: Stream Match to Facebook (Azure Kernel Compatible)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          # PulseAudio Setup Fix
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink sink_properties=device.description=Virtual_Sink || true
          pactl set-default-sink virtual_sink || true
          
          # Get the correct sink monitor source index/name
          sleep 2
          SINK_MONITOR=$(pactl list sources short | grep virtual_sink | awk '{print $2}')
          echo "Using audio source: $SINK_MONITOR"

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            await page.goto('https://footfytv.pro/watch/4728', {
              waitUntil: 'networkidle2'
            });

            await new Promise(r => setTimeout(r, 6000));

            await page.evaluate(async () => {
              window.open = function() { return null; };

              const buttons = Array.from(document.querySelectorAll('button, a, div.server-item, span, li'));
              const fancodefhdBtn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('fancodefhd'));
              
              if (fancodefhdBtn) {
                fancodefhdBtn.click();
              }

              await new Promise(resolve => setTimeout(resolve, 4000));

              const video = document.querySelector('video');
              if (video) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                
                if (video.requestFullscreen) {
                  video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                  video.webkitRequestFullscreen();
                }
              }
            });
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 20

          # Clean FFmpeg streaming command without looping feedback tone
          ffmpeg -y \
            -f x11grab -framerate 24 -video_size 1280x720 -i :99.0 \
            -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -map_metadata -1 \
            -filter_complex \
            "[0:v]crop=1280:680:0:40,\
            scale=1260:670,\
            pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,\
            eq=brightness=0.04:contrast=1.08:saturation=1.05,\
            noise=alls=25:allf=t+u,\
            drawbox=x=1130:y=15:w=140:h=90:color=blue:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LIVE':x=1165:y=48:fontsize=24:fontcolor=yellow,\
            drawbox=x=980:y=115:w=280:h=35:color=black@0.9:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='🔴 HD BROADCAST':x=990:y=122:fontsize=16:fontcolor=yellow[v]; \
            [1:a]highpass=f=200,lowpass=f=3000,volume=1.5[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 550k -maxrate 750k -bufsize 1500k \
            -max_muxing_queue_size 2048 \
            -c:a aac -b:a 96k -ar 44100 -ac 2 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize \
            -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}"
