name: Stream Match to Facebook (Azure Kernel Compatible)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget

          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 --log-target=syslog || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true
          pactl set-default-source virtual_speaker.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          const TARGET_URL = 'https://www.streamx.website/match?id=cricket-0-australia-vs-england&title=Australia%20Vs%20England';

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            page.on('console', (msg) => {
              console.log('[PAGE CONSOLE]:', msg.text());
            });
            page.on('pageerror', (err) => {
              console.log('[PAGE ERROR]:', err.message);
            });

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close().catch(() => {});
                }
              }
            });

            await page.evaluateOnNewDocument(() => {
              window.open = function () { return null; };
            });

            console.log('Navigating to Australia vs England stream...');
            try {
              await page.goto(TARGET_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              console.log('Loaded URL:', page.url());
            } catch (e) {
              console.log('Navigation error:', e.message);
            }

            await new Promise((r) => setTimeout(r, 12000));

            async function clickFancodeInContext(ctx, idx) {
              return ctx.evaluate((frameIdx) => {
                window.open = function () { return null; };
                const candidates = Array.from(
                  document.querySelectorAll('button, a, div, span, li, [role="button"]')
                );
                for (const el of candidates) {
                  const text = (el.innerText || el.textContent || '').trim().toLowerCase().replace(/\s+/g, ' ');
                  const attrs = [
                    el.getAttribute('aria-label') || '',
                    el.getAttribute('title') || '',
                    el.getAttribute('data-server') || '',
                    el.getAttribute('data-channel') || '',
                    typeof el.className === 'string' ? el.className : ''
                  ].join(' ').toLowerCase();

                  const isSmallOrButton =
                    el.tagName === 'BUTTON' ||
                    el.tagName === 'A' ||
                    el.getAttribute('role') === 'button' ||
                    text.length <= 45;

                  if (isSmallOrButton && (text.includes('fancode') || attrs.includes('fancode'))) {
                    el.scrollIntoView({ block: 'center', inline: 'center' });
                    el.click();
                    return { clicked: true, frameIdx, matchedText: text || attrs.slice(0, 50) };
                  }
                }
                return { clicked: false, frameIdx };
              }, idx).catch((e) => ({ clicked: false, frameIdx: idx, err: e.message }));
            }

            async function applyFullscreenAndPlayInContext(ctx, idx) {
              return ctx.evaluate(async (frameIdx) => {
                window.open = function () { return null; };

                const styleId = 'force-fancode-fullscreen-style';
                if (!document.getElementById(styleId)) {
                  const style = document.createElement('style');
                  style.id = styleId;
                  style.textContent = `
                    html, body {
                      margin: 0 !important;
                      padding: 0 !important;
                      width: 1280px !important;
                      height: 720px !important;
                      overflow: hidden !important;
                      background: #000 !important;
                    }
                    iframe, video {
                      position: fixed !important;
                      top: 0 !important;
                      left: 0 !important;
                      width: 1280px !important;
                      height: 720px !important;
                      max-width: 1280px !important;
                      max-height: 720px !important;
                      z-index: 2147483647 !important;
                      background: #000 !important;
                      object-fit: contain !important;
                    }
                  `;
                  (document.head || document.documentElement).appendChild(style);
                }

                const playCandidates = Array.from(
                  document.querySelectorAll('button, [role="button"], .play, .vjs-big-play-button, .jw-icon-display')
                );
                for (const el of playCandidates) {
                  const txt = (el.innerText || el.ariaLabel || el.className || '').toLowerCase();
                  if (txt.includes('play') || el.className.toString().toLowerCase().includes('play')) {
                    try { el.click(); } catch (e) {}
                  }
                }

                const videos = Array.from(document.querySelectorAll('video'));
                for (const video of videos) {
                  video.muted = false;
                  video.volume = 1.0;
                  video.controls = false;
                  video.style.position = 'fixed';
                  video.style.top = '0';
                  video.style.left = '0';
                  video.style.width = '1280px';
                  video.style.height = '720px';
                  video.style.zIndex = '2147483647';
                  video.style.objectFit = 'contain';
                  try {
                    await video.play();
                  } catch (e) {}
                }

                return {
                  frameIdx,
                  videos: videos.length,
                  paused: videos.map((v) => v.paused),
                  readyStates: videos.map((v) => v.readyState)
                };
              }, idx).catch((e) => ({ frameIdx: idx, err: e.message }));
            }

            let clickedFancode = false;
            for (let i = 0; i < page.frames().length; i++) {
              const res = await clickFancodeInContext(page.frames()[i], i);
              console.log('[FANCODE CLICK CHECK]:', JSON.stringify(res));
              if (res.clicked) clickedFancode = true;
            }

            await new Promise((r) => setTimeout(r, 6000));

            const syncPlayer = async () => {
              const frames = page.frames();
              for (let i = 0; i < frames.length; i++) {
                if (!clickedFancode) {
                  const clickRes = await clickFancodeInContext(frames[i], i);
                  if (clickRes.clicked) {
                    clickedFancode = true;
                    console.log('[FANCODE LATE CLICK]:', JSON.stringify(clickRes));
                  }
                }
                const info = await applyFullscreenAndPlayInContext(frames[i], i);
                console.log('[PLAYER SYNC]:', JSON.stringify(info));
              }
            };

            await syncPlayer();
            setInterval(syncPlayer, 6000);

            await new Promise(() => {});
          })();
          EOF

          node launch.js > launch.log 2>&1 &
          sleep 30
          echo "=== LAUNCH.JS LOGS ==="
          cat launch.log || true
          echo "======================"

          cat << 'FFEOF' > run_stream.sh
          #!/usr/bin/env bash
          while true; do
            ffmpeg -y \
              -thread_queue_size 2048 \
              -f x11grab -framerate 25 -video_size 1280x720 -i :99.0 \
              -thread_queue_size 2048 \
              -f pulse -i virtual_speaker.monitor \
              -filter_complex "\
              color=c=black:s=1280x720:r=25[bg];\
              [0:v]crop=in_w-32:in_h-32:16:16,scale=1280:720,fps=25,\
              rotate=2*PI/180:fillcolor=black:ow=1280:oh=720,\
              zoompan=z='0.96+0.012*sin(on*0.025)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720,\
              noise=alls=12:allf=t+u,\
              split=4[q0][q1][q2][q3];\
              [q0]crop=640:360:0:0,hue=h=-45:s=1.35,colorbalance=rs=0.22:gs=-0.12:bs=0.14:rm=0.18:gm=-0.10:bm=0.12[tl];\
              [q1]crop=640:360:640:0,hue=h=75:s=1.35,colorbalance=rs=-0.16:gs=0.24:bs=-0.08:rm=-0.12:gm=0.18:bm=-0.06[tr];\
              [q2]crop=640:360:0:360,hue=h=35:s=1.35,colorbalance=rs=0.18:gs=0.16:bs=-0.22:rm=0.14:gm=0.12:bm=-0.16[bl];\
              [q3]crop=640:360:640:360,hue=h=-110:s=1.35,colorbalance=rs=-0.14:gs=0.06:bs=0.24:rm=-0.10:gm=0.04:bm=0.18[br];\
              [bg][tl]overlay=x='6*sin(t*0.8)':y='5*cos(t*0.7)':shortest=1[s1];\
              [s1][tr]overlay=x='640+6*cos(t*0.75)':y='5*sin(t*0.85)':shortest=1[s2];\
              [s2][bl]overlay=x='6*cos(t*0.65)':y='360+5*sin(t*0.8)':shortest=1[s3];\
              [s3][br]overlay=x='640+6*sin(t*0.85)':y='360+5*cos(t*0.75)':shortest=1,\
              drawgrid=w=2:h=6:color=black@0.08:t=1,\
              drawbox=x=0:y='mod(t*100, 720)':w=1280:h=3:color=white@0.05:t=fill,\
              drawbox=x=15:y=15:w=220:h=55:color=black@0.95:t=fill,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='OFFICIAL BROADCAST':x=15+(220-text_w)/2:y=15+(55-text_h)/2:fontsize=15:fontcolor=white,\
              drawbox=x=900:y=35:w=360:h=60:color=black@0.95:t=fill,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='JACOB SUPER HD':x=900+(360-text_w)/2:y=35+(60-text_h)/2:fontsize=20:fontcolor=yellow,\
              drawtext=text='LIVE STREAM ONGOING':x='mod(t*60, w+300)-150':y=h-22:fontsize=16:fontcolor=white@0.9:box=1:boxcolor=black@0.6:boxborderw=2,\
              drawtext=text='%{localtime\:%H\:%M\:%S}':x=w-105:y=105:fontsize=15:fontcolor=white:box=1:boxcolor=red@0.8:boxborderw=2,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SUPPORT US • SHARE':x=20:y='110+sin(t*3)*10':fontsize=18:fontcolor=cyan:box=1:boxcolor=black@0.7:boxborderw=3[v];\
              anoisesrc=color=pink:amplitude=0.015:sample_rate=44100[bgnoise];\
              [1:a]highpass=f=65,lowpass=f=2400,bass=g=11:f=110:w=0.8,equalizer=f=180:width_type=h:w=120:g=6,vibrato=f=2.5:d=0.25,aecho=in_gain=0.85:out_gain=0.9:delays=110|180:decays=0.55|0.4,asetrate=44100*0.76,atempo=1.3157,aresample=44100:async=1:first_pts=0[main_a];\
              [main_a][bgnoise]amix=inputs=2:weights='1 0.15':duration=shortest,asetpts=PTS-STARTPTS[a]" \
              -map "[v]" -map "[a]" \
              -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1600k -maxrate 1900k -bufsize 3800k \
              -max_muxing_queue_size 4096 \
              -c:a aac -b:a 96k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -rtmp_live live \
              -flvflags no_duration_filesize \
              -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ secrets.FB_KEY }}" || true
            echo "Stream ended or dropped, reconnecting in 1s..."
            sleep 1
          done
          FFEOF

          bash run_stream.sh
          
