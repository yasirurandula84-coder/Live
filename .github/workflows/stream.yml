name: Stream M3U8 to Rumble (Auto-Reconnect)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            curl \
            wget

      - name: Start Direct M3U8 Stream to Rumble
        run: |
          # FFmpeg streaming directly from the .m3u8 link inside an Auto-Reconnect Loop
          while true; do
            echo "Starting/Restarting FFmpeg stream from M3U8 to Rumble..."
            ffmpeg -y \
              -re -i "https://jn352.sportvideodata.com/4339746397539165665_4U3Mt5CdzlGb5FGbw9CM4ETbhVmc0N3Lx82Lt92YuUWbhdGN0Z2bz5ibkNmY/p9.m3u8" \
              -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 50 -keyint_min 50 -b:v 1500k -maxrate 2000k -bufsize 4000k \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -flvflags no_duration_filesize \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -f flv "rtmp://rtmp.rumble.com/live/k-9v1e-qofn-s2hh-1kh7-480aa1" || true
            
            echo "Stream disconnected. Reconnecting in 3 seconds..."
            sleep 3
          done
          
