name: Stream Match to Kick (Direct Play)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure DNS & Install Dependencies
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

          sudo apt-get update || sudo apt-get update --fix-missing
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            alsa-utils \
            fonts-dejavu-core \
            curl \
            wget
            
          npm install puppeteer

      - name: Start Virtual Display & Stream
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_sink || true
          pactl set-default-sink virtual_sink || true
          pactl set-default-source virtual_sink.monitor || true

          cat << 'EOF' > launch.js
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-gpu',
                '--window-size=1280,720',
                '--autoplay-policy=no-user-gesture-required',
                '--start-fullscreen',
                '--block-new-web-contents'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36');

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const newPage = await target.page();
                if (newPage && newPage !== page) {
                  await newPage.close();
                }
              }
            });

            console.log("Navigating directly to site...");
            await page.goto('https://footfytv.my/match.php?id=5480&stream=2', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            console.log("Waiting for player to render...");
            await new Promise(r => setTimeout(r, 8000));

            // Direct Video Auto-Recovery & Fullscreen Loop (No extra clicks needed)
            await page.evaluate(async () => {
              window.open = function() { return null; };

              setInterval(() => {
                let videos = Array.from(document.querySelectorAll('video'));
                
                // Search inside iframes if video is embedded
                document.querySelectorAll('iframe').forEach(iframe => {
                  try {
                    const iframeVideos = iframe.contentDocument.querySelectorAll('video');
                    videos = videos.concat(Array.from(iframeVideos));
                  } catch (e) {}
                });

                if (videos.length > 0) {
                  videos.forEach(video => {
                    if (video.paused || video.ended) {
                      video.play().catch(() => {});
                    }
                    video.muted = false;
                    video.volume = 1.0;

                    // Force 720p layout positioning to fill virtual display
                    video.style.position = 'fixed';
                    video.style.top = '0';
                    video.style.left = '0';
                    video.style.width = '1280px';
                    video.style.height = '720px';
                    video.style.zIndex = '999999';
                    video.style.objectFit = 'cover';
                  });
                }
              }, 1000);
            });

            await page.waitForTimeout(99999999);
          })();
          EOF

          node launch.js > /dev/null 2>&1 &
          sleep 20

          # Clean FFmpeg Pipeline using Virtual Sink, Timestamp fixes, and Kick RTMPS Destination
          cat << 'FFEOF' > run_stream.sh
          ffmpeg -y \
            -fflags +genpts \
            -thread_queue_size 2048 -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 \
            -thread_queue_size 2048 -f pulse -ar 44100 -ac 2 -i virtual_sink.monitor \
            -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -g 60 -keyint_min 60 -b:v 2000k -maxrate 2500k -bufsize 5000k \
            -fps_mode cfr \
            -max_muxing_queue_size 4096 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 -async 1 \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -flvflags no_duration_filesize+no_metadata \
            -f flv "rtmps://fa723fc1b171.global-contribute.live-video.net:443/app/sk_us-west-2_5pe0dOCLoCrz_FnAVd9FoD0vc5x8CjJ552JPX57agTV"
          FFEOF

          bash run_stream.sh
          
